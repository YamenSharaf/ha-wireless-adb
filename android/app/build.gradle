plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'dev.yamen.wirelessadb'
    compileSdk 34

    defaultConfig {
        applicationId "dev.yamen.wirelessadb"
        minSdk 30
        targetSdk 34
        versionCode APP_VERSION_CODE.toInteger()
        versionName APP_VERSION_NAME

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // No build-time webhook: it's an optional runtime setting, set over
        // ADB (see WebhookConfig.kt), so one APK works for every device.
    }

    // Release key: app/release.keystore, written by CI from repository
    // secrets. Without it (local builds, forks) both build types fall back to
    // the Android debug key; such APKs can't update a release install.
    def releaseKeystore = file("release.keystore")

    signingConfigs {
        release {
            def storePass = localProperties.getProperty('RELEASE_STORE_PASSWORD', "dummy")
            def keyPass = localProperties.getProperty('RELEASE_KEY_PASSWORD', storePass) // PKCS12 uses same password
            storeFile releaseKeystore
            storePassword storePass
            keyAlias localProperties.getProperty('RELEASE_KEY_ALIAS', "dummy")
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            signingConfig releaseKeystore.exists() ? signingConfigs.release : signingConfigs.debug
            // R8: the app is a few hundred lines; without shrinking the APK is
            // ~12 MB of unused library code, and it ships inside every
            // integration release.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig releaseKeystore.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
