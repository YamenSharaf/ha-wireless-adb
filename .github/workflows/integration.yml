name: Integration

# Validates the integration on every change and publishes a release whenever
# the version in manifest.json changes. To release: bump "version" in
# custom_components/wireless_adb/manifest.json and push to main.

on:
  push:
    branches:
      - main
    paths:
      - 'custom_components/**'
      - 'hacs.json'
      - '.github/workflows/integration.yml'
  pull_request:
    paths:
      - 'custom_components/**'
      - 'hacs.json'
      - '.github/workflows/integration.yml'
  schedule:
    # Weekly, so breaking changes in Home Assistant beta show up early.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  release:
    name: Release
    needs: [hassfest, hacs]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the release notes

      - name: Read version
        id: ver
        run: |
          VERSION=$(jq -r .version custom_components/wireless_adb/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::v$VERSION is already released; bump the version in manifest.json to publish a new one"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The release zip carries the newest helper app build so the
      # integration can install and update it on the device (helper.py).
      - name: Bundle the helper app
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("app-v"))] | sort_by(.created_at) | last | .tag_name')
          if [ -z "$APP_TAG" ] || [ "$APP_TAG" = "null" ]; then
            echo "::error::No helper app release (app-v…) found to bundle"; exit 1
          fi
          # app-v<versionName>-<versionCode>
          APP_NAME=$(echo "$APP_TAG" | sed -E 's/^app-v(.+)-([0-9]+)$/\1/')
          APP_CODE=$(echo "$APP_TAG" | sed -E 's/^app-v(.+)-([0-9]+)$/\2/')
          DIR=custom_components/wireless_adb/helper
          mkdir -p "$DIR"
          gh release download "$APP_TAG" --pattern '*.apk' --output "$DIR/wireless-adb-helper.apk"
          SHA=$(sha256sum "$DIR/wireless-adb-helper.apk" | cut -d' ' -f1)
          jq -n --arg name "$APP_NAME" --argjson code "$APP_CODE" --arg sha "$SHA" --arg tag "$APP_TAG" \
            '{version_name: $name, version_code: $code, sha256: $sha, release: $tag}' > "$DIR/helper.json"
          cat "$DIR/helper.json"
          echo "app_tag=$APP_TAG" >> "$GITHUB_OUTPUT"
        id: helper

      # HACS installs from this zip (hacs.json: zip_release). It holds the
      # integration folder's contents, not the folder itself.
      - name: Build release zip
        if: steps.ver.outputs.exists == 'false'
        run: |
          cd custom_components/wireless_adb
          find . -name '__pycache__' -prune -exec rm -rf {} +
          zip -r -X "$GITHUB_WORKSPACE/wireless_adb.zip" .
          unzip -l "$GITHUB_WORKSPACE/wireless_adb.zip"

      # Integration releases are tagged v<version>; the helper app's builds
      # use app-v… prerelease tags and are left out of the notes.
      - name: Create release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PREV=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          RANGE=${PREV:+$PREV..}HEAD
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$RANGE" -- custom_components hacs.json
            if [ -n "$PREV" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...v${VERSION}"
            fi
            echo
            echo "Bundles helper app \`${{ steps.helper.outputs.app_tag }}\`."
          } > notes.md
          cat notes.md

          FLAGS=()
          # Versions like 0.2.0b1 or 0.2.0rc1 are published as prereleases.
          if [[ "$VERSION" =~ (a|b|rc|dev)[0-9]*$ ]]; then FLAGS+=(--prerelease); fi

          gh release create "v$VERSION" \
            --title "Wireless ADB $VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            "${FLAGS[@]}" \
            wireless_adb.zip
