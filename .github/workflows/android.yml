name: Helper app (APK)

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '!android/**.md'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Needed so the workflow can create a GitHub Release
permissions:
  contents: write

env:
  # versionCode = run number + offset. The offset dates from the move out of
  # the localwifidebug repo (whose builds reached versionCode 7); since the
  # rename to dev.yamen.wirelessadb it's no longer needed, but changing it
  # would make later builds look like downgrades, so it stays.
  VERSION_CODE_OFFSET: 100

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Read app version
        id: ver
        run: |
          NAME=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${{ github.run_number }} + VERSION_CODE_OFFSET ))" >> "$GITHUB_OUTPUT"

      # Stable signing key (so updates install in place and keep the
      # ADB-granted WRITE_SECURE_SETTINGS) comes from repository secrets,
      # never from the repo. Forks don't have them: their builds fall back to
      # the debug key (see app/build.gradle) and publish no release.
      - name: Restore signing keystore
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No release key (ANDROID_KEYSTORE_BASE64 not set): building a debug-signed APK, no release"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Write local.properties
        if: steps.key.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cat > local.properties <<PROPS
          RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD}
          RELEASE_KEY_PASSWORD=${KEYSTORE_PASSWORD}
          RELEASE_KEY_ALIAS=wirelessadb
          PROPS

      - name: Build release APK
        run: |
          # The project ships no gradlew script, only the wrapper jar.
          java -cp gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain assembleRelease --no-daemon --stacktrace \
            -PAPP_VERSION_CODE=${{ steps.ver.outputs.code }}

      - name: Remove signing material
        if: always()
        run: rm -f app/release.keystore local.properties

      - uses: actions/upload-artifact@v7
        with:
          name: helper-app-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Prerelease with an app- tag: HACS ignores prereleases by default, so
      # these don't show up as integration versions.
      - name: Create GitHub prerelease
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}"
          gh release create "$TAG" \
            app/build/outputs/apk/release/*.apk \
            --prerelease \
            --title "Helper app ${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})" \
            --target "${{ github.sha }}" \
            --notes "Automated build from ${GITHUB_SHA:0:7} (versionName ${{ steps.ver.outputs.name }}, versionCode ${{ steps.ver.outputs.code }})"
