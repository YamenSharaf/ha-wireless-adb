name: Helper app (APK)

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '!android/**.md'
      - '!android/flowchart.*'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      webhook_id:
        description: "HA webhook ID (the part after /api/webhook/)"
        required: true
        default: "<webhook-id>"
      ha_url:
        description: "Home Assistant base URL"
        required: true
        default: "http://<ha-host>:8123"
      device_id:
        description: "Identifier sent to HA (free text)"
        required: true
        default: "<device-id>"

# Needed so the workflow can create a GitHub Release
permissions:
  contents: write

env:
  # versionCode = run number + offset. The offset dates from the move out of
  # the localwifidebug repo (whose builds reached versionCode 7); since the
  # rename to dev.yamen.wirelessadb it's no longer needed, but changing it
  # would make later builds look like downgrades, so it stays.
  VERSION_CODE_OFFSET: 100

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    # Push events have no inputs, so fall back to the same defaults as workflow_dispatch
    env:
      WEBHOOK_ID: ${{ github.event.inputs.webhook_id || '<webhook-id>' }}
      HA_URL: ${{ github.event.inputs.ha_url || 'http://<ha-host>:8123' }}
      DEVICE_ID: ${{ github.event.inputs.device_id || '<device-id>' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Read app version
        id: ver
        run: |
          NAME=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${{ github.run_number }} + VERSION_CODE_OFFSET ))" >> "$GITHUB_OUTPUT"

      # Stable signing key (so updates install in place and keep the
      # ADB-granted WRITE_SECURE_SETTINGS) comes from repository secrets,
      # never from the repo.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Write local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cat > local.properties <<PROPS
          WEBHOOK_URL=${HA_URL}/api/webhook/${WEBHOOK_ID}
          DEVICE_ID=${DEVICE_ID}
          RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD}
          RELEASE_KEY_PASSWORD=${KEYSTORE_PASSWORD}
          RELEASE_KEY_ALIAS=wirelessadb
          PROPS
          echo "--- webhook (shown for verification) ---"
          grep WEBHOOK_URL local.properties

      - name: Build release APK
        run: |
          # The project ships no gradlew script, only the wrapper jar.
          java -cp gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain assembleRelease --no-daemon --stacktrace \
            -PAPP_VERSION_CODE=${{ steps.ver.outputs.code }}

      - name: Remove signing material
        if: always()
        run: rm -f app/release.keystore local.properties

      - uses: actions/upload-artifact@v7
        with:
          name: helper-app-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Prerelease with an app- tag: HACS ignores prereleases by default, so
      # these don't show up as integration versions.
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}"
          gh release create "$TAG" \
            app/build/outputs/apk/release/*.apk \
            --prerelease \
            --title "Helper app ${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})" \
            --target "${{ github.sha }}" \
            --notes "Automated build from ${GITHUB_SHA:0:7} (versionName ${{ steps.ver.outputs.name }}, versionCode ${{ steps.ver.outputs.code }}, device: ${DEVICE_ID}, webhook: ${WEBHOOK_ID})"
